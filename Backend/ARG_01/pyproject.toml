[project]
name = "arg-01"
version = "0.1.0"
description = "Backend for ARG-01 arm"
readme = "README.md"
authors = [
    { name = "Платоха", email = "platongimp96@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "ultralytics>=8.4.197",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
