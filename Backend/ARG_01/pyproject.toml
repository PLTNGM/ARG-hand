[project]
name = "arg-01"
version = "0.1.0"
description = "Backend for ARG-01 arm"
readme = "README.md"
authors = [
    { name = "Платоха", email = "platongimp96@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.162.0",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "ultralytics>=8.4.197",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=7.0.0",          
    "pytest-asyncio>=0.21.0", 
    "ruff>=0.1.0",       
]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "UP"]
fixable = ["ALL"]
allowed-confusables = []

[tool.ruff.lint.bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "Depends"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: живые тесты с подключением к реальной ESP32",
]